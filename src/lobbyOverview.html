<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splendor Lobby Overview</title>

  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="mask-icon" href="safari-pinned-tab.svg" color="#5bbad5">

  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/screen.css">
  <link rel="stylesheet" href="assets/css/lobby-overview-screen.css">

  <script src="assets/js/index.js" type="module"></script>
</head>
<body>
<!--  Splendor  deployment test
  Create your amazing and wonderful interface here. Have fun!-->
  <header>
    <nav>
      <a href="index.html">⬅</a>
    </nav>
    <h1>Select a game to join or spectate</h1>
    <div class="username">
      <img src="./images/username%20logo.png">
      <p id="username">John Doe</p>
    </div>
  </header>

  <div class="lobby-overview-container">
    <template id="join-lobby">
      <div class="lobby-container">
        <p class="lobbyname">John doe's Lobby</p>
        <p class="playercount">3/4</p>
        <input type="button" value="JOIN" class="join-button">
        <input type="button" value="SPECTATE" class="spectate-button">
      </div>
    </template>

    <div class="lobby-container locked">
      <p class="lobbyname">Jane doe's Lobby</p>
      <p class="locked">🔒</p>
<!--      TODO: Make the lock css background image-->
      <p class="playercount">2/4</p>
      <input type="button" value="JOIN" class="join-button-locked">
      <input type="button" value="SPECTATE" class="spectate-button-locked">
    </div>

  </div>

  <div class="errormessages">
    <p></p>
  </div>
</body>
</html>
