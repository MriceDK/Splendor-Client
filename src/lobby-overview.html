<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splendor Lobby Overview</title>

  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
  <link rel="mask-icon" href="safari-pinned-tab.svg" color="#5bbad5">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/screen.css">
  <link rel="stylesheet" href="assets/css/game-setup/lobby-overview-screen.css">
  <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap" rel="stylesheet">


  <script src="assets/js/components/game-setup/lobby-overview/lobby-overview.js" type="module"></script>
  <link rel="stylesheet" href="assets/css/gameplay/popup-screen.css">
</head>
<body>
<!--  Splendor  deployment test
  Create your amazing and wonderful interface here. Have fun!-->
<div class="popup-container hidden">
  <template id="username-popup-template">
    <div class="popup">
      <a href="#" id="close-popup">
        <p>Close</p>
      </a>
      <form id="playername-changer">
        <label for="playername-text">Username: </label>
        <input type="text" id="playername-text" name="playername" maxlength="15">
        <button type="submit" id="playername-button" class="button-style-popup button-style">Change Username</button>
      </form>
      <p class="error-username-selector"></p>
    </div>
  </template>
</div>
  <header>
    <nav>
      <a href="index.html">⬅</a>
    </nav>
    <h1>Select a game to join or spectate</h1>
    <div class="playername">
      <a href="#" id="renderButton">
        <img src="./images/user-logo.png" alt="playername logo" title="playername logo" id="profile-picture">
        <span id="playername">Select Username</span>
      </a>

    </div>
  </header>
  <main>
  <form id="filter">
    <div id="search">
      <label for="searchbar">Search for a lobby by name</label>
      <input type="text" placeholder="Enter lobby name" id="searchbar">
    </div>

    <input type="checkbox" id="show-started-filter">
    <label for="show-started-filter">Show started</label>

    <input type="checkbox" id="show-unstarted-filter" checked>
    <label for="show-unstarted-filter">Show unstarted</label>

    <input type="checkbox" id="show-full-filter">
    <label for="show-full-filter">Show full lobbies</label>

    <input type="checkbox" id="show-joinable-filter" checked>
    <label for="show-joinable-filter">Show joinable lobbies</label>

<!--    <input type="checkbox" id="show-public-filter" checked>-->
<!--    <label for="show-public-filter">Show public lobbies</label>-->

<!--    <input type="checkbox" id="show-private-filter">-->
<!--    <label for="show-private-filter">Show private lobbies</label>-->

    <div id="player-amount">
      <label for="amount-of-players-in-lobby-filter">Amount of players:</label>
      <select id="amount-of-players-in-lobby-filter">
        <option value="isAny" selected>Any amount of players</option>
        <option value="2">2 Players</option>
        <option value="3">3 Players</option>
        <option value="4">4 Players</option>
      </select>
    </div>
  </form>

  <div class="lobby-overview-container">

    <template id="join-lobby-template">
      <section class="lobby">
        <p class="lobbyname">John doe's Lobby</p>
        <p class="playercount">3/4</p>
        <div class="buttons">
          <button class="join-button">JOIN</button>
          <button class="spectate-button">SPECTATE</button>
        </div>
      </section>
    </template>

    <div class="lobby locked">
      <p class="lobbyname">Jane doe's Lobby</p>
      <p class="locked">🔒</p>
<!--      TODO: Make the lock css background image-->
      <p class="playercount">2/4</p>
        <button class="join-button">JOIN</button>
        <button class="spectate-button">SPECTATE</button>

    </div>

  </div>
  </main>
  <div class="errormessages">
    <p></p>
  </div>
</body>
</html>
