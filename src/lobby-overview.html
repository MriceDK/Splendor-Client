<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splendor Lobby Overview</title>

  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/screen.css">
  <link rel="stylesheet" href="assets/css/game-setup/lobby-overview-screen.css">
  <link rel="stylesheet" href="assets/css/game-setup/avatar-selector.css">
  <link rel="stylesheet" href="assets/css/gameplay/popup-screen.css">
  <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <script src="assets/js/components/game-setup/lobby-overview/lobby-overview.js" type="module"></script>
</head>
<body>
<!--  Splendor  deployment test
  Create your amazing and wonderful interface here. Have fun!-->
<div class="popup-container hidden">
  <div class="setup-popup-templates">
    <template id="username-popup-template">
      <div class="popup">
        <a href="#" id="close-popup">
          <p id="close-popup-text">Close</p>
        </a>
        <form id="playername-changer">
          <label for="playername-text">Username: </label>
          <input type="text" id="playername-text" name="playername" maxlength="15" autocomplete="off">
          <button type="submit" id="playername-button" class="button-style-popup button-style">Change Username</button>
            <section id="avatar-selector-container">
                <div class="avatar-selector">
                    <button id="left-btn">&larr;</button>
                    <img id="avatar-display" src="" alt="Avatar" />
                    <button id="right-btn">&rarr;</button>
                </div>
            </section>
        </form>
        <p class="error-username-selector"></p>
      </div>
    </template>
    <template id="lobby-full-popup-template">
      <div class="popup lobby-popup">
        <form id="back-to-lobby-overview">
          <h2></h2>
          <button type="submit" class="close-lobby-full-popup button-style-popup button-style">Go Back</button>
        </form>
      </div>
    </template>
    <template id="private-lobby-password-popup-template">
      <div class="popup password-popup">
        <form id="private-lobby-password-form">
          <label for="private-lobby-password-input">Enter Password</label>
          <input type="password" id="private-lobby-password-input" name="private-lobby-password-input" maxlength="20" autocomplete="off">
          <p class="error-message"></p>

          <input type="submit" class="join-private-game-button button-style" value="Join Lobby">
          <input type="button" class="close-password-popup button-style" value="Cancel">
        </form>
      </div>

    </template>
  </div>
</div>
  <header>
    <nav>
      <a href="index.html">⬅</a>
    </nav>
    <div class="playername">
      <a href="#" id="renderButton">
        <img src="assets/images/user-logo.png" alt="playername logo" title="playername logo" id="profile-picture">
        <span id="playername">Select Username</span>
      </a>

    </div>
  </header>
  <main>
    <h1>Select a game to join or spectate</h1>

    <form id="filter">
      <div id="search">
        <label for="searchbar">Lobby Name:</label>
        <input type="text" placeholder="Enter lobby name" id="searchbar">
      </div>

      <div id="player-amount">
        <label for="amount-of-players-in-lobby-filter">Amount of players:</label>
        <select id="amount-of-players-in-lobby-filter">
          <option value="isAny" selected>Any amount of players</option>
          <option value="2">2 Players</option>
          <option value="3">3 Players</option>
          <option value="4">4 Players</option>
        </select>
      </div>

      <div class="checkboxes">
        <label for="show-started-filter" class="bomb-check">
          <input type="checkbox" id="show-started-filter" class="bomb-check">
          <span class="bomb-shape"></span>
          Show started
        </label>

        <label for="show-unstarted-filter" class="bomb-check">
          <input type="checkbox" id="show-unstarted-filter" checked>
          <span class="bomb-shape"></span>
          Show unstarted
        </label>

        <label for="show-full-filter" class="bomb-check">
          <input type="checkbox" id="show-full-filter">
          <span class="bomb-shape"></span>
          Show full lobbies
        </label>

        <label for="show-joinable-filter" class="bomb-check">
          <input type="checkbox" id="show-joinable-filter" checked>
          <span class="bomb-shape"></span>
          Show joinable lobbies
        </label>

        <label for="show-private-filter" class="bomb-check">
          <input type="checkbox" id="show-private-filter">
          <span class="bomb-shape"></span>
          Show private lobbies
        </label>

        <label for="show-public-filter" class="bomb-check">
            <input type="checkbox" id="show-public-filter" checked>
          <span class="bomb-shape"></span>
          Show public lobbies
        </label>


      </div>
  </form>

  <div class="lobby-overview-container">

    <template id="join-lobby-template">
      <section class="lobby">
        <p class="lobbyname">John doe's Lobby</p>
        <p class="playercount">3/4</p>
        <div class="buttons">
          <button class="join-button">JOIN</button>
          <button class="spectate-button">SPECTATE</button>
        </div>
      </section>
    </template>

  </div>
  </main>
  <div class="errormessages">
    <p></p>
  </div>
</body>
</html>
