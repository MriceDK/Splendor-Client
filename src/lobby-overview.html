<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splendor Lobby Overview</title>

  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="mask-icon" href="safari-pinned-tab.svg" color="#5bbad5">

  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/screen.css">
  <link rel="stylesheet" href="assets/css/lobby-overview-screen.css">

  <script src="./assets/js/lobby-overview-component/lobby-overview.js" type="module"></script>
</head>
<body>
<!--  Splendor  deployment test
  Create your amazing and wonderful interface here. Have fun!-->
  <header>
    <nav>
      <a href="index.html">⬅</a>
    </nav>
    <h1>Select a game to join or spectate</h1>
    <div class="username">
      <button type="button">
        <img src="./images/username%20logo.png" alt="username logo" title="username logo" id="profile-picture">
        <span id="username">Select Username</span>
      </button>

    </div>
  </header>

  <div class="lobby-overview-container">

    <template id="join-lobby-template">
      <section class="lobby">
        <p class="lobbyname">John doe's Lobby</p>
        <p class="playercount">3/4</p>
        <div class="buttons">
          <button class="join-button-locked">JOIN</button>
          <button class="spectate-button-locked">SPECTATE</button>
        </div>
      </section>
    </template>

    <div class="lobby locked">
      <p class="lobbyname">Jane doe's Lobby</p>
      <p class="locked">🔒</p>
<!--      TODO: Make the lock css background image-->
      <p class="playercount">2/4</p>
        <button class="join-button">JOIN</button>
        <button class="spectate-button">SPECTATE</button>

    </div>

  </div>

  <div class="errormessages">
    <p></p>
  </div>
</body>
</html>
