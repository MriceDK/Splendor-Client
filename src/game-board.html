<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Splendor Lobbyname</title>
    <link rel="mask-icon" href="safari-pinned-tab.svg" color="#5bbad5">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/screen.css">
    <link rel="stylesheet" href="assets/css/gameplay/game-board-screen.css">
    <link rel="stylesheet" href="assets/css/gameplay/development-card.css">
    <link rel="stylesheet" href="assets/css/gameplay/player-ui.css">
    <link rel="stylesheet" href="assets/css/gameplay/token-bank.css">
    <link rel="stylesheet" href="assets/css/gameplay/lobby-name-game-board.css">
    <link rel="stylesheet" href="assets/css/gameplay/confirmation-popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap"
          rel="stylesheet">

    <script src="assets/js/components/popup/confirmation-popup/confirmation-popup-init.js" type="module"></script>
    <script type="module" src="./assets/js/game.js"></script>
    <script src="assets/js/components/popup/settings-popup/init.js" type="module"></script>
    <link rel="stylesheet" href="assets/css/gameplay/settings-screen.css">
</head>
<body>
<template id="token-selector">
    <div class="popup-token-selector">
        <div class="errormessages">
            <p></p>
        </div>
        <form id="token-selector-form" action="#" method="GET">
            <input id="token-selector-dev-card" type="hidden" name="dev-card" value="">
            <label for="token-selector-emerald">
                Emerald
                <input class="gem-selector-input" id="token-selector-emerald" type="number" name="emerald" value="0"
                       min="0">
            </label>
            <label for="token-selector-ruby">
                Ruby
                <input class="gem-selector-input" id="token-selector-ruby" type="number" name="ruby" value="0" min="0">
            </label>
            <label for="token-selector-sapphire">
                Sapphire
                <input class="gem-selector-input" id="token-selector-sapphire" type="number" name="sapphire" value="0"
                       min="0">
            </label>
            <label for="token-selector-diamond">
                Diamond
                <input class="gem-selector-input" id="token-selector-diamond" type="number" name="diamond" value="0"
                       min="0">
            </label>
            <label for="token-selector-onyx">
                Onyx
                <input class="gem-selector-input" id="token-selector-onyx" type="number" name="onyx" value="0" min="0">
            </label>
            <label for="token-selector-gold">
                Gold
                <input class="gem-selector-input" id="token-selector-gold" type="number" name="gold" value="0" min="0">
            </label>
            <button type="button" id="token-selector-close-button">Cancel</button>
            <input type="submit" value="confirm-payment">
        </form>

    </div>
</template>

<template id="buy-popup-template">
    <div class="confirmation-popup popup">
        <h3 class="title-popup">buy ${cardname}</h3>
        <button type="button" class="close-pop-up-button">Cancel Purchase</button>
        <button type="button" class="confirm-pop-up-button">Buy Card</button>
    </div>
</template>
<template id="reserve-deck-popup-template">
    <div class="confirmation-popup popup">
        <h3 class="title-popup">Reserve card from level ${cardname}?</h3>
        <div class="errormessages">
            <p></p>
        </div>
        <button type="button" class="close-pop-up-button">Cancel Reservation</button>
        <button type="button" class="confirm-pop-up-button">Reserve Card</button>

    </div>
</template>
<template id="buy-or-reserve-popup-template">
    <div class="confirmation-popup popup">
        <h3 class="title-popup"></h3>
        <div class="errormessages">
            <p></p>
        </div>
        <button type="button" class="cancel-pop-up-button">Reserve Card</button>
        <button type="button" class="confirm-pop-up-button">Buy Card</button>
        <button type="button" class="close-pop-up-button">X</button>

    </div>
</template>
<template id="too-many-gems-pop-up-template">
    <form id="too-many-gems-pop-up-form" action="#" method="GET" class="popup">
        <label for="token-remover-emerald">
            Emerald
        </label>
        <input class="gem-remover-input" id="token-remover-emerald" type="number" name="emerald" min="0">

        <label for="token-remover-ruby">
            Ruby
        </label>
        <input class="gem-remover-input" id="token-remover-ruby" type="number" name="ruby" min="0">

        <label for="token-remover-sapphire">
            Sapphire
        </label>
        <input class="gem-remover-input" id="token-remover-sapphire" type="number" name="sapphire" min="0">

        <label for="token-remover-diamond">
            Diamond
        </label>
        <input class="gem-remover-input" id="token-remover-diamond" type="number" name="diamond" min="0">

        <label for="token-remover-onyx">
            Onyx
        </label>
        <input class="gem-remover-input" id="token-remover-onyx" type="number" name="onyx" min="0">

        <label for="token-remover-gold">
            Gold
        </label>
        <input class="gem-remover-input" id="token-remover-gold" type="number" name="gold" min="0">

        <button type="submit" id="gem-remover-button" value="confirm-removal">Remove Gems</button>


    </form>
</template>

<template id="settings-popup-template">
    <div class="popup">
        <button class="forfeit">Forfeit</button>
        <button class="close">Close</button>
        <div class="forfeit-popup hidden">
            <p>Do you want to forfeit?</p>
            <button class="forfeit-yes">Yes</button>
            <button class="forfeit-no">No</button>
        </div>
    </div>
</template>

<div class="popup-container hidden">

</div>

<main>

    <header>
        <div class="settings">
            <button id="settings"><img src="images/settings-icon.png" alt="settings icon" title="settings icon">
            </button>
        </div>
    </header>
    <div class="username-flexcontainer">
        <template id="opponent-template">
            <div class="opponent">
                <p class="player"></p>
                <p class="points"></p>
                <div class="reserved-section">
                    <p class="reserved-label"><span id="reserved-count"></span> reserved</p>
                </div>
                <div class="inventory">
                    <div class="token gems red">
                        <p class="token-text"></p>
                    </div>
                    <div class="card red">
                        <p class="token-text"></p>
                    </div>
                </div>
                <div class="inventory">
                    <div class="gems green">
                        <p class="token-text"></p>
                    </div>
                    <div class="card green">
                        <p class="token-text"></p>
                    </div>
                </div>
                <div class="inventory">
                    <div class="gems black">
                        <p class="token-text"></p>
                    </div>
                    <div class="card black">
                        <p class="token-text"></p>
                    </div>
                </div>
                <div class="inventory">
                    <div class="gems blue">
                        <p class="token-text"></p>
                    </div>
                    <div class="card blue">
                        <p class="token-text"></p>
                    </div>
                </div>
                <div class="inventory">
                    <div class="gems white">
                        <p class="token-text"></p>
                    </div>
                    <div class="card white">
                        <p class="token-text"></p>
                    </div>
                </div>
                <div class="inventory">
                    <div class="gems yellow">
                        <p class="token-text"></p>
                    </div>
                </div>

                <div class="nobles-container hidden">

                </div>
            </div>

        </template>


    </div>
    <div class="market-grid-container">
            <template id="noble">

                <article class="noble-article">
                    <h2 class="noble-name hidden"></h2>
                    <p class="prestige-point"></p>
                    <ul class="bonus-costs">
                    </ul>
                </article>
    
            </template>




        <template id="level-card">

            <article class="deck">
                <h2>Level <span class="level-title"></span></h2>
                <p><span class="card-amount"></span> left</p>
            </article>

        </template>

        <template id="development-card">

            <article class="development-card">
                <h2 class="development-card-title hidden">title</h2>
                <span class="prestige-point">1</span>
                <img class="bonus" src="#" alt="bonus">
                <div class="gem-costs">
                </div>
            </article>

        </template>

    </div>
    <div class="lobby-info">
        <h1 class="splendor-name">Splendor</h1>
        <h2 class="lobby-name">Lobby Name</h2>
        <div class="spectators">
            <p id="spectators">spectators:</p>
        </div>
    </div>
    <section class="bank-flexcontainer">
        <h2>Bank</h2>
        <div class="token-bank">
            <button class="ruby">0</button>
            <button class="emerald">0</button>
            <button class="onyx">0</button>
            <button class="sapphire">0</button>
            <button class="diamond">0</button>
            <button class="gold" disabled>0</button>
        </div>
        <div class="selected-tokens"></div>
        <div class="bank-buttons">
            <button class="hidden cancel-button">Cancel</button>
            <button class="clickable take-gems-button">Take Gems</button>
            <button class="hidden collect-gems-button" disabled>Collect Gems</button>
        </div>
    </section>
    <div class="user-info-flexcontainer">
        <p class="player">My user</p>
        <div id="own-player-card">
            <h2 id="own-username">Username</h2>
            <div id="own-prestige-points"><p></p></div>
            <div class="nobles-container"></div>
            <div class="own-purse">
                <p>Your Purse:</p>
                <div class="own-inventory">
                    <div class="gems ruby">
                        <p class="token-text">0</p>
                    </div>
                    <div class="card ruby">
                        <p class="card-text">0</p>
                    </div>
                </div>
                <div class="own-inventory">
                    <div class="gems emerald">
                        <p class="token-text">0</p>
                    </div>
                    <div class="card emerald">
                        <p class="card-text">0</p>
                    </div>
                </div>
                <div class="own-inventory">
                    <div class="gems onyx">
                        <p class="token-text">0</p>
                    </div>
                    <div class="card onyx">
                        <p class="card-text">0</p>
                    </div>
                </div>
                <div class="own-inventory">
                    <div class="gems sapphire">
                        <p class="token-text">0</p>
                    </div>
                    <div class="card sapphire">
                        <p class="card-text">0</p>
                    </div>
                </div>
                <div class="own-inventory">
                    <div class="gems diamond">
                        <p class="token-text">0</p>
                    </div>
                    <div class="card diamond">
                        <p class="card-text">0</p>
                    </div>
                </div>
                <div class="own-inventory">
                    <div class="gems gold">
                        <p class="token-text">0</p>
                    </div>
                </div>
            </div>
            <div class="own-reserved-cards"></div>
        </div>

    </div>
    <div class="history">
        <p>History</p>
    </div>
</main>
</body>
</html>
