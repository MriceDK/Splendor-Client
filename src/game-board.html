<!DOCTYPE html>

<body>

    <main>
<!--        3 Columns-->
<!--        2 Rows-->

        <header>

                        </div>
                    </div>
                    <div class="inventory">
                        <div class="token gems red">
                            <p class="token-text">3</p>
                        </div>
                        <div class="token card red">
                            <p class="token-text">1</p>
                        </div>
                    </div>
                    <div class="inventory">
                        <div class="token gems green">
                            <p class="token-text">3</p>
                        </div>

                        </div>
                    </div>
                    <div class="inventory">

                            <p class="token-text">3</p>

                    </div>

                        </div>
                    </div>
                    <div class="inventory">
                        <div class="token gems white">
                            <p class="token-text">3</p>

                        <div class="token card white">
                            <p class="token-text">1</p>
                        </div>
                    </div>
                    <div class="inventory">
                        <div class="token gems yellow">
                            <p class="token-text">3</p>
                        </div>
                    </div>

                    <div class="nobles-container">
                        <p class="noble">noble1</p>
                        <p class="noble">noble2</p>
                        <p class="noble">noble3</p>
                    </div>
                </div>

            </div>
        <div class="market-grid-container">
            <p>Development card Market</p>
        </div>
        <div class="lobby-info">
            <p>Lobby Name</p>
        </div>
        <div class="bank-flexcontainer">
            <p>Bank</p>
        </div>
        <div class="user-info-flexcontainer">
            <p>My user</p>
        </div>
        <div class="history">

        </div>
