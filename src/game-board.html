<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Splendor Lobbyname</title>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/screen.css">
    <link rel="stylesheet" href="assets/css/game-board-screen.css">

    <link rel="stylesheet" href="assets/css/opponent-ui.css">
    <script src="assets/js/own-player-component/init.js" type="module"></script>
    <script src="assets/js/opponent-card-component/init.js" type="module"></script>
    <link rel="stylesheet" href="assets/css/token-bank.css">
</head>
<body>

    <main>
<!--        3 Columns-->
<!--        2 Rows-->

        <header>
            <a href="#">Settings</a>
        </header>
            <div class="username-flexcontainer">
                <template id="opponent-template">
                    <div class="opponent">
                        <p class="player"></p>
                        <p class="points"></p>
                        <div class="reserved-section">
                            <p class="reserved-label"><span id="reserved-count"></span> reserved</p>
                        </div>
                        <div class="inventory">
                            <div class="token gems red">
                                <p class="token-text"></p>
                            </div>
                            <div class="card red">
                                <p class="token-text"></p>
                            </div>
                        </div>
                        <div class="inventory">
                            <div class="gems green">
                                <p class="token-text"></p>
                            </div>
                            <div class="card green">
                                <p class="token-text"></p>
                            </div>
                        </div>
                        <div class="inventory">
                            <div class="gems black">
                                <p class="token-text"></p>
                            </div>
                            <div class="card black">
                                <p class="token-text"></p>
                            </div>
                        </div>
                        <div class="inventory">
                            <div class="gems blue">
                                <p class="token-text"></p>
                            </div>
                            <div class="card blue">
                                <p class="token-text"></p>
                            </div>
                        </div>
                        <div class="inventory">
                            <div class="gems white">
                                <p class="token-text"></p>
                            </div>
                            <div class="card white">
                                <p class="token-text"></p>
                            </div>
                        </div>
                        <div class="inventory">
                            <div class="gems yellow">
                                <p class="token-text"></p>
                            </div>
                        </div>
    
                        <div class="nobles-container hidden">
                            <p class="noble">noble1</p>
                            <p class="noble">noble2</p>
                            <p class="noble">noble3</p>
                        </div>
                    </div>

                </template>


            </div>
        <div class="market-grid-container">
            <p>Development card Market</p>
        </div>
        <div class="lobby-info">
            <p>Lobby Name</p>
        </div>
        <section class="bank-flexcontainer">
            <h2>Bank</h2>
            <div class="token-bank">
                <button class="red-token">1</button>
                <button class="green-token">1</button>
                <button class="black-token">1</button>
                <button class="blue-token">1</button>
                <button class="white-token">1</button>
                <button class="joker-token">1</button>
            </div>
            <div class="selected-tokens">
                <button></button>
                <button></button>
                <button class="hidden"></button>
            </div>
            <div class="bank-buttons">
                <button >Cancel</button>
                <button class="hidden">Take Gems</button>
                <button >Collect Gems</button>
            </div>
        </section>
        <div class="user-info-flexcontainer">
            <p>My user</p>
            <div id="own-player-card">
                <h2 id="own-username">Username</h2>
                <div id="own-prestige-points"><p></p></div>
                <div id="nobles"></div>
                <div id="own-gems"><div id="own-bonuses"></div></div>
                <div id="own-reservated-cards"></div>
            </div>

        </div>
        <div class="history">
            <p>History</p>
        </div>
    </main>
</body>
</html>
