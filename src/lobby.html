<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splendor</title>
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/screen.css">
    <link rel="stylesheet" href="assets/css/lobby-screen.css">
    <script type="module" src="assets/js/lobby-component/lobby.js"></script>
</head>
<body>
<div class="grid">
    <header>
        <nav>
            <a href="index.html">⬅</a>
        </nav>
        <div class="username">
            <img src="./images/username%20logo.png" alt="profile photo">
            <p id="username">John Doe</p>
        </div>
    </header>
    <main>
        <h3>Creator</h3>
        <h2 class="title">'s Lobby</h2>
        <section class="middle">
            <ol class="users">
                <li id="creator">Player1</li>
                <li id="user2">Player2</li>
                <li id="user3">Player3</li>
                <li id="user4">Player4</li>
            </ol>
            <div class="bottom">
                <p>1/4 Players</p>
                <p>Spectators</p>
                <p>Waiting for all players to join</p>
            </div>
        </section>
    </main>
</div>
<div class="errormessages">
    <p></p>
</div>
</body>
</html>
