<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splendor</title>
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/screen.css">
    <link rel="stylesheet" href="assets/css/lobby-screen.css">
    <script type="module" src="assets/js/lobby-component/lobby.js"></script>
</head>
<body>
<div class="grid">
    <header>
        <nav>
            <a href="index.html">⬅</a>
        </nav>
        <div class="playername">
            <img src="./images/username%20logo.png" alt="profile photo">
            <p id="playername">John Doe</p>
        </div>
    </header>
    <main>
        <h2>Creator</h2>
        <h1 id="title">'s Lobby</h1>
        <section class="middle">
            <ol class="users">
                <template id="player">
                    <li id="creator">Player1</li>
                </template>
            </ol>
            <div class="bottom">
                <p id="playerCount">1/4 Players</p>
                <p id="specators">Spectators</p>
                <p>Waiting for all players to join</p>
            </div>
        </section>
    </main>
</div>
<div class="errormessages">
    <p></p>
</div>
</body>
</html>
