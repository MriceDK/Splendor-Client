<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splendor</title>
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="mask-icon" href="safari-pinned-tab.svg" color="#5bbad5">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/screen.css">
    <link rel="stylesheet" href="assets/css/game-setup/lobby-screen.css">
    <script type="module" src="assets/js/components/game-setup/lobby/lobby.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap" rel="stylesheet">
</head>
<body>
<div class="grid">
    <header>
        <nav>
            <a href="index.html">⬅</a>
        </nav>
        <div class="playerName">
            <img src="./images/user-logo.png" alt="profile photo">
            <p id="playerName">John Doe</p>
        </div>
    </header>
    <main>
        <h2>Creator:</h2>
        <h1 id="title">'s Lobby</h1>
        <div class="middle">
            <ol class="users">
                <template id="player">
                    <li id="creator">Player1</li>
                </template>
            </ol>
            <div class="bottom">
                <p id="playerCount">1/4 Players</p>
                <p id="specators">Spectators</p>
                <p>Waiting for all players to join</p>
            </div>
        </div>
    </main>
</div>
<div class="errormessages">
    <p></p>
</div>
</body>
</html>
