<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splendor</title>

    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="mask-icon" href="safari-pinned-tab.svg" color="#5bbad5">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/screen.css">
    <link rel="stylesheet" href="assets/css/create-lobby.css">

    <script type="module" src="./assets/js/lobby-creator-component/lobby-creator.js"></script>

</head>
<body>
    <header>
        <nav>
            <a href="index.html">⬅</a>
        </nav>
        <h1>Create lobby</h1>
        <a href="username-selector.html">
            <img src="./images/username%20logo.png" alt="username logo" title="username logo" id="profile-picture">
            <span id="username">Select Username</span>
        </a>
    </header>
    <main>

        <form id="lobby-create-form" class="lobby-create-form" action="#" method="GET">

            <section>
                <h2 class="form-title">Lobby name:</h2>
                <input id="lobby-name" name="lobby-name" type="text">
            </section>

            <section>
                <h2 class="form-title">Amount of players</h2>

                <div class="options">
                    <div class="radio-option">
                        <input required id="player-amount-2" name="player-amount" type="radio" value="2">
                        <label for="player-amount-2">2</label>
                    </div>
                    <div class="radio-option">
                        <input required id="player-amount-3" name="player-amount" type="radio" value="3">
                        <label for="player-amount-3">3</label>
                    </div>
                    <div class="radio-option">
                        <input required id="player-amount-4" name="player-amount" type="radio" value="4">
                        <label for="player-amount-4">4</label>
                    </div>
                </div>
            </section>

            <!--
            <section>
                <h2 class="form-title">Max seconds per turn:</h2>
                <input type="number" value="60" max="600" min="60">
            </section>
            -->

            <!--<section>
                <h2 class="form-title">Match type:</h2>

                <div class="options">
                    <div class="radio-option">
                        <input type="radio" name="public-or-private" id="public" value="public">
                        <label for="public">Public</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" name="public-or-private" id="private" value="private">
                        <label for="private">Private</label>
                    </div>
                </div>

            </section>-->
            <input class="submit" type="submit" value="Create game">
        </form>
    </main>

<!-- <div class="errormessages">
    <p></p>

</body>
</html>
